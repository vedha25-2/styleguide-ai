<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fashion Hanger / Diamond Icon -->
  <g transform="translate(15, 12)">
    <!-- Glowing background badge -->
    <rect x="0" y="0" width="76" height="76" rx="22" fill="url(#brandGrad)" />
    
    <!-- Stylized Crown / Hanger / Diamond geometry -->
    <path d="M 38 20 L 58 35 L 50 60 L 26 60 L 18 35 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Center sparkle -->
    <circle cx="38" cy="38" r="4" fill="#ffffff" filter="url(#softGlow)"/>
    <path d="M 38 28 L 38 48 M 28 38 L 48 38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Small AI Stars -->
    <path d="M 56 22 L 58 26 L 62 28 L 58 30 L 56 34 L 54 30 L 50 28 L 54 26 Z" fill="#fbcfe8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 48)">
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="800" fill="#1e1b4b" letter-spacing="-0.5">
      Style<tspan fill="url(#brandGrad)">Guide</tspan> <tspan font-weight="400" font-size="28" fill="#ec4899">AI</tspan>
    </text>
    <text y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a855f7" letter-spacing="1.5" text-transform="uppercase">
      Personalised Style Guidance
    </text>
  </g>
</svg>
